<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VeritasAI | Synthetic Content Forensics</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center py-10 px-4">
    <div class="max-w-3xl w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8">
        <div class="flex items-center justify-between border-b border-slate-800 pb-5 mb-6">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">VERITAS<span class="text-indigo-400">AI</span></h1>
                <p class="text-sm text-slate-400">Multimodal Synthetic Content Detection</p>
            </div>
            <div class="flex space-x-2 bg-slate-950 p-1 rounded-lg border border-slate-800">
                <button id="tabImgBtn" onclick="switchTab('image')" class="px-4 py-1.5 text-sm font-medium rounded-md bg-indigo-500 text-white shadow">Image</button>
                <button id="tabTxtBtn" onclick="switchTab('text')" class="px-4 py-1.5 text-sm font-medium rounded-md text-slate-400 hover:text-white transition">Text</button>
            </div>
        </div>

        <!-- Image Upload Section -->
        <div id="imageSection">
            <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-xl p-6 cursor-pointer transition bg-slate-950/50">
                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="verifyImage()">
                <img id="preview" class="max-h-64 rounded-lg mb-4 hidden object-contain border border-slate-800" />
                <div id="uploadPrompt" class="text-center">
                    <p class="text-base font-medium text-slate-200">Click to upload an image</p>
                    <p class="text-xs text-slate-500 mt-1">Evaluated via CLIP ViT-L/14 + Linear SVM</p>
                </div>
            </label>
        </div>

        <!-- Text Input Section -->
        <div id="textSection" class="hidden">
            <textarea id="textInput" rows="6" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-slate-200 focus:outline-none focus:border-indigo-500 transition" placeholder="Paste text here to detect AI generation (ChatGPT, Claude, etc.)..."></textarea>
            <button onclick="verifyText()" class="mt-4 w-full bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-3 rounded-xl transition shadow-lg">Analyze Text</button>
        </div>

        <!-- Loading Spinner -->
        <div id="loader" class="hidden text-center py-6 text-indigo-400 font-mono text-sm animate-pulse">
            Analyzing content...
        </div>

        <!-- Results Panel -->
        <div id="resultBox" class="hidden mt-6 space-y-5 border-t border-slate-800 pt-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-xs uppercase tracking-wider text-slate-400">Forensic Verdict</p>
                    <h2 id="verdictText" class="text-2xl font-extrabold mt-1"></h2>
                </div>
                <div class="text-right">
                    <p class="text-xs uppercase tracking-wider text-slate-400">Confidence</p>
                    <p id="confidenceText" class="text-2xl font-mono font-bold text-white mt-1"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.getElementById('resultBox').classList.add('hidden');
            if (tab === 'image') {
                document.getElementById('imageSection').classList.remove('hidden');
                document.getElementById('textSection').classList.add('hidden');
                document.getElementById('tabImgBtn').className = "px-4 py-1.5 text-sm font-medium rounded-md bg-indigo-500 text-white shadow";
                document.getElementById('tabTxtBtn').className = "px-4 py-1.5 text-sm font-medium rounded-md text-slate-400 hover:text-white transition";
            } else {
                document.getElementById('imageSection').classList.add('hidden');
                document.getElementById('textSection').classList.remove('hidden');
                document.getElementById('tabTxtBtn').className = "px-4 py-1.5 text-sm font-medium rounded-md bg-indigo-500 text-white shadow";
                document.getElementById('tabImgBtn').className = "px-4 py-1.5 text-sm font-medium rounded-md text-slate-400 hover:text-white transition";
            }
        }

        function showResult(prediction, confidence) {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('resultBox').classList.remove('hidden');
            const verdictEl = document.getElementById('verdictText');
            verdictEl.textContent = prediction;
            verdictEl.className = prediction.includes("AI") ? "text-2xl font-extrabold mt-1 text-rose-500" : "text-2xl font-extrabold mt-1 text-emerald-400";
            document.getElementById('confidenceText').textContent = confidence + "%";
        }

        async function verifyImage() {
            const input = document.getElementById('fileInput');
            if (!input.files || !input.files[0]) return;
            
            document.getElementById('uploadPrompt').classList.add('hidden');
            const preview = document.getElementById('preview');
            preview.src = URL.createObjectURL(input.files[0]);
            preview.classList.remove('hidden');
            
            document.getElementById('resultBox').classList.add('hidden');
            document.getElementById('loader').classList.remove('hidden');

            const formData = new FormData();
            formData.append('file', input.files[0]);

            try {
                const res = await fetch('/detect/image', { method: 'POST', body: formData });
                const data = await res.json();
                showResult(data.prediction, data.confidence_score);
            } catch (e) {
                alert("Error analyzing image.");
                document.getElementById('loader').classList.add('hidden');
            }
        }

        async function verifyText() {
            const text = document.getElementById('textInput').value;
            if (!text.trim()) return;

            document.getElementById('resultBox').classList.add('hidden');
            document.getElementById('loader').classList.remove('hidden');

            try {
                const res = await fetch('/detect/text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await res.json();
                showResult(data.prediction, data.confidence_score);
            } catch (e) {
                alert("Error analyzing text.");
                document.getElementById('loader').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
